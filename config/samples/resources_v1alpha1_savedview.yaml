apiVersion: resources.signoz.io/v1alpha1
kind: SavedView
metadata:
  name: savedview-sample
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-operator
spec:
  # Typed form: the API server validates these fields at apply.
  objectTemplate:
    spec:
      name: error-logs
      spec:
        displayName: Error logs
        panelType: list
        queries:
        - type: builder_query
          spec:
            name: A
            filter:
              expression: severity_text = 'ERROR'
            signal: logs
        requestType: raw
      schemaVersion: v2
      source: logs
  providerConfigRef:
    name: providerconfig-sample
---
apiVersion: resources.signoz.io/v1alpha1
kind: SavedView
metadata:
  name: savedview-sample-json
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-operator
spec:
  # jsonSpec form: the SigNoz request body, sent verbatim.
  objectTemplate:
    jsonSpec: |-
      {
        "name": "slow-traces",
        "schemaVersion": "v2",
        "source": "traces",
        "spec": {
          "displayName": "Slow traces",
          "panelType": "trace",
          "requestType": "trace",
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "traces",
                "filter": {"expression": "duration_nano > 1000000000"}
              }
            }
          ]
        }
      }
  providerConfigRef:
    name: providerconfig-sample
