---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - resources.signoz.io
  resources:
  - clusterproviderconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - resources.signoz.io
  resources:
  - clusterproviderconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - resources.signoz.io
  resources:
  - clusterproviderconfigs/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-role
  namespace: signoz-operator-system
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - resources.signoz.io
  resources:
  - authdomains
  - dashboards
  - providerconfigs
  - savedviews
  - users
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - resources.signoz.io
  resources:
  - authdomains/finalizers
  - dashboards/finalizers
  - providerconfigs/finalizers
  - savedviews/finalizers
  - users/finalizers
  verbs:
  - update
- apiGroups:
  - resources.signoz.io
  resources:
  - authdomains/status
  - dashboards/status
  - providerconfigs/status
  - savedviews/status
  - users/status
  verbs:
  - get
  - patch
  - update
