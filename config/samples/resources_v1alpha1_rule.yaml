apiVersion: resources.signoz.io/v1alpha1
kind: Rule
metadata:
  name: rule-sample
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-operator
spec:
  # Typed form: the API server validates these fields at apply, including the
  # v2alpha1 requirements — a selected query, thresholds, an evaluation window
  # and notification settings. Alert carries the rule name.
  objectTemplate:
    spec:
      labels:
        severity: critical
      alert: High memory usage
      alertType: METRIC_BASED_ALERT
      condition:
        compositeQuery:
          panelType: graph
          queries:
          - type: builder_query
            spec:
              name: A
              aggregations:
              - metricName: system_memory_utilization
                spaceAggregation: max
                timeAggregation: avg
              filter:
                expression: state = 'used'
              signal: metrics
              stepInterval: 1m
          queryType: builder
        selectedQueryName: A
        thresholds:
          kind: basic
          spec:
          - name: critical
            matchType: at_least_once
            op: above
            target: 0.9
      description: Memory usage stayed above 90% of capacity
      evaluation:
        kind: rolling
        spec:
          evalWindow: 5m
          frequency: 1m
      notificationSettings:
        renotify:
          alertStates:
          - firing
          enabled: true
          interval: 4h
      ruleType: threshold_rule
      schemaVersion: v2alpha1
  providerConfigRef:
    name: providerconfig-sample
---
apiVersion: resources.signoz.io/v1alpha1
kind: Rule
metadata:
  name: rule-sample-json
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-operator
spec:
  # jsonSpec form: the SigNoz request body, sent verbatim. Use it to import a
  # rule exported from the SigNoz UI unchanged.
  objectTemplate:
    jsonSpec: |-
      {
        "alert": "Error log spike",
        "alertType": "LOGS_BASED_ALERT",
        "ruleType": "threshold_rule",
        "schemaVersion": "v2alpha1",
        "labels": {"severity": "warning"},
        "condition": {
          "selectedQueryName": "A",
          "compositeQuery": {
            "panelType": "graph",
            "queryType": "builder",
            "queries": [
              {
                "type": "builder_query",
                "spec": {
                  "name": "A",
                  "signal": "logs",
                  "stepInterval": "1m",
                  "aggregations": [{"expression": "count()"}],
                  "filter": {"expression": "severity_text = 'ERROR'"}
                }
              }
            ]
          },
          "thresholds": {
            "kind": "basic",
            "spec": [{"name": "warning", "op": "above", "matchType": "at_least_once", "target": 100}]
          }
        },
        "evaluation": {
          "kind": "rolling",
          "spec": {"evalWindow": "5m", "frequency": "1m"}
        },
        "notificationSettings": {
          "groupBy": ["service.name"],
          "usePolicy": true
        }
      }
  providerConfigRef:
    name: providerconfig-sample
