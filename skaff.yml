resources:
  user:
    identity:
      field: email
    create:
      path: /api/v2/users
      method: POST
      status:
        signozResource:
          id: data.id
    read:
      path: /api/v2/users/{id}
      method: GET
    update:
      path: /api/v2/users/{id}
      method: PUT
    delete:
      path: /api/v2/users/{id}
      method: DELETE
    schema:
      ignores:
        - data
        - status
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
        - userRoles
        - frontendBaseUrl
