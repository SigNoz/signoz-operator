apiVersion: resources.signoz.io/v1alpha1
kind: ServiceAccount
metadata:
  name: serviceaccount-sample
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-operator
spec:
  # Typed form: the API server validates these fields at apply. A service
  # account is created by name alone; its roles and API keys are separate
  # objects.
  objectTemplate:
    spec:
      name: ci-pipeline
  providerConfigRef:
    name: providerconfig-sample
---
apiVersion: resources.signoz.io/v1alpha1
kind: ServiceAccount
metadata:
  name: serviceaccount-sample-json
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-operator
spec:
  # jsonSpec form: the SigNoz request body, sent verbatim.
  objectTemplate:
    jsonSpec: |-
      {
        "name": "terraform-runner"
      }
  providerConfigRef:
    name: providerconfig-sample
