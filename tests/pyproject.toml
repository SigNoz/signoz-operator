[project]
name = "signoz-operator-tests"
version = "0.1.0"
description = "End-to-end tests for the SigNoz Operator"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.3",
    "pytest>=9.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["e2e"]
python_files = ["[0-9][0-9]_*.py", "setup.py"]
addopts = "-ra -p no:warnings --import-mode=importlib"
log_cli = true
log_format = "%(asctime)s [%(levelname)s] (%(filename)s:%(lineno)s) %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 140
extend-exclude = [".venv", "pours", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PL"]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR2004", # magic-value-comparison
]
