apiVersion: resources.signoz.io/v1alpha1
kind: RoutePolicy
metadata:
  name: routepolicy-sample
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-operator
spec:
  # Typed form: the API server validates these fields at apply. The expression
  # matches alert labels; channels name existing notification channels. Kind is
  # optional to the schema but SigNoz accepts only rule or policy.
  objectTemplate:
    spec:
      name: payments-oncall
      kind: policy
      channels:
      - payments-slack
      description: Send payment service alerts to the payments on-call channel
      expression: service == "payments"
      tags:
      - payments
  providerConfigRef:
    name: providerconfig-sample
---
apiVersion: resources.signoz.io/v1alpha1
kind: RoutePolicy
metadata:
  name: routepolicy-sample-json
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-operator
spec:
  # jsonSpec form: the SigNoz request body, sent verbatim.
  objectTemplate:
    jsonSpec: |-
      {
        "name": "critical-pager",
        "description": "Page for any critical alert",
        "kind": "policy",
        "expression": "severity == \"critical\"",
        "channels": ["pagerduty-critical"]
      }
  providerConfigRef:
    name: providerconfig-sample
