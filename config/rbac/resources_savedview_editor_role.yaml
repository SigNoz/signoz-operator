# This rule is not used by the project signoz-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the resources.signoz.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: signoz-operator
    app.kubernetes.io/managed-by: kustomize
  name: resources-savedview-editor-role
rules:
- apiGroups:
  - resources.signoz.io
  resources:
  - savedviews
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - resources.signoz.io
  resources:
  - savedviews/status
  verbs:
  - get
