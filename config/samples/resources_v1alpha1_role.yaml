apiVersion: resources.signoz.io/v1alpha1
kind: Role
metadata:
  name: role-sample
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-operator
spec:
  # Typed form: the API server validates these fields at apply, including the
  # resource kind and type of every transaction group. A selector is either a
  # resource id or "*" for every object of that kind; the verb must be one the
  # resource supports.
  objectTemplate:
    spec:
      name: dashboard-reader
      description: Read every dashboard, change none
      transactionGroups:
      - objectGroup:
          resource:
            kind: dashboard
            type: metaresource
          selectors:
          - "*"
        relation: read
      - objectGroup:
          resource:
            kind: dashboard
            type: metaresource
          selectors:
          - "*"
        relation: list
  providerConfigRef:
    name: providerconfig-sample
---
apiVersion: resources.signoz.io/v1alpha1
kind: Role
metadata:
  name: role-sample-json
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-operator
spec:
  # jsonSpec form: the SigNoz request body, sent verbatim.
  objectTemplate:
    jsonSpec: |-
      {
        "name": "alert-responder",
        "description": "Read alert rules and acknowledge maintenance windows",
        "transactionGroups": [
          {
            "relation": "read",
            "objectGroup": {
              "resource": {"kind": "rule", "type": "metaresource"},
              "selectors": ["*"]
            }
          },
          {
            "relation": "update",
            "objectGroup": {
              "resource": {"kind": "planned-maintenance", "type": "metaresource"},
              "selectors": ["*"]
            }
          }
        ]
      }
  providerConfigRef:
    name: providerconfig-sample
