apiVersion: resources.signoz.io/v1alpha1
kind: Dashboard
metadata:
  name: dashboard-sample
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-operator
spec:
  # Typed form: the API server validates these fields at apply. Panels,
  # layouts and variables carry the full query-builder schema; this sample
  # stays minimal.
  objectTemplate:
    spec:
      name: service-overview
      spec:
        display:
          name: Service overview
          description: Golden signals for the demo service
        layouts: []
        panels: {}
        variables: []
      schemaVersion: v2
      tags:
      - value: platform
        key: team
  providerConfigRef:
    name: providerconfig-sample
---
apiVersion: resources.signoz.io/v1alpha1
kind: Dashboard
metadata:
  name: dashboard-sample-json
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-operator
spec:
  # jsonSpec form: the SigNoz request body, sent verbatim. Use it to import a
  # dashboard exported from the SigNoz UI unchanged.
  objectTemplate:
    jsonSpec: |-
      {
        "name": "service-overview-json",
        "schemaVersion": "v2",
        "tags": [],
        "spec": {
          "display": {"name": "Service overview (JSON)"},
          "layouts": [],
          "panels": {},
          "variables": []
        }
      }
  providerConfigRef:
    name: providerconfig-sample
