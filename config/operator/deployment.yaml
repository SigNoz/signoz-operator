apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz-operator
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: signoz-operator
      control-plane: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signoz-operator
        control-plane: controller-manager
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      terminationGracePeriodSeconds: 10
      serviceAccountName: signoz-operator
      containers:
      - name: manager
        image: controller:latest
        command:
        - /manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        ports:
        - name: health
          protocol: TCP
          containerPort: 8081
        env:
        - name: SIGNOZ_OPERATOR_OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
        livenessProbe:
          httpGet:
            port: 8081
            path: /healthz
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            port: 8081
            path: /readyz
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
          readOnlyRootFilesystem: true
      volumes: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
