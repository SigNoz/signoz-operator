apiVersion: resources.signoz.io/v1alpha1
kind: User
metadata:
  name: user-sample
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-operator
spec:
  # Typed form: the API server validates these fields at apply.
  objectTemplate:
    spec:
      displayName: Alice
      email: alice@example.com
  providerConfigRef:
    name: providerconfig-sample
---
apiVersion: resources.signoz.io/v1alpha1
kind: User
metadata:
  name: user-sample-json
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-operator
spec:
  # jsonSpec form: the SigNoz request body, sent verbatim. Use it to set fields
  # the typed form omits, such as roles and the invite-email base URL.
  objectTemplate:
    jsonSpec: |-
      {
        "email": "bob@example.com",
        "displayName": "Bob",
        "frontendBaseUrl": "https://signoz.example.com",
        "userRoles": [{"id": "role-id-here"}]
      }
  providerConfigRef:
    name: providerconfig-sample
