# This rule is not used by the project signoz-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to resources.signoz.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: signoz-operator
    app.kubernetes.io/managed-by: kustomize
  name: resources-authdomain-viewer-role
rules:
- apiGroups:
  - resources.signoz.io
  resources:
  - authdomains
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - resources.signoz.io
  resources:
  - authdomains/status
  verbs:
  - get
